name: Compilar APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Aceptar licencias del Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Preparar proyecto (descomprime el zip)
        run: |
          if [ -f settings.gradle.kts ]; then
            DIR="."
          else
            ZIP=$(ls -1 *.zip 2>/dev/null | head -n 1)
            if [ -z "$ZIP" ]; then echo "No se encontro ningun .zip en el repositorio"; exit 1; fi
            mkdir -p _proyecto
            unzip -q -o "$ZIP" -d _proyecto
            DIR=$(dirname "$(find _proyecto -name settings.gradle.kts | head -n 1)")
          fi
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"

      - name: Compilar
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/Alarma.apk"

      - name: Guardar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Alarma-APK
          path: Alarma.apk

      - name: Publicar en Releases (descarga directa)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: alarma-v${{ github.run_number }}
          name: Alarma v${{ github.run_number }}
          files: Alarma.apk
